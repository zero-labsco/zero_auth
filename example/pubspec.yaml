name: zero_auth_example
description: Example app demonstrating zero_auth.
publish_to: none
environment:
  sdk: ^3.4.0
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  zero_auth:
    path: ../
  flutter_secure_storage: ^9.0.0
  dio: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Bundles the MaterialIcons font; without this every Icon widget renders as
  # tofu boxes (empty squares) on desktop and mobile builds.
  uses-material-design: true
