name: zero_auth_example_server
description: Simple standalone Dart backend for the zero_auth example app.
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.4.0

dependencies:
  # Real token signing (HMAC-SHA256 JWTs). This backend is repo-only and never
  # published, depending on `crypto` costs nothing at the package level.
  crypto: ^3.0.6

dev_dependencies: {}
